[project]
name = "it-support-agent"
version = "0.1.0"
description = "This is an autonomous IT support agent"
readme = "README.md"
authors = [
    { name = "vikas yadav", email = "thejsdeveloper@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.57.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
it-support-agent = "it_support_agent.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
